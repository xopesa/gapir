<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gapir</title>
<style>
  :root { color-scheme: light dark; --bg: #f8fbff; --fg: #0f172a; --muted: #64748b; --primary: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --fg: #e2e8f0; --muted: #94a3b8; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 340px; padding: 24px 16px; text-align: center; }
  .logo { font-size: 64px; line-height: 1; }
  h1 { margin: 12px 0 8px; font-size: 28px; }
  p { margin: 6px 0; color: var(--muted); line-height: 1.5; }
  button { margin-top: 20px; width: 100%; min-height: 52px; border: 0; border-radius: 16px; background: var(--primary); color: #fff; font: inherit; font-weight: 800; font-size: 17px; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">🐼</div>
  <h1>Gapir</h1>
  <p>第一次打开需要联网下载课程。之后没有网络也能学习。</p>
  <p>Для первого запуска нужен интернет, чтобы скачать уроки. Потом приложение работает и без сети.</p>
  <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">重试 · Повторить</button>
</main>
</body>
</html>
