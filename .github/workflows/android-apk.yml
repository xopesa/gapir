# Builds the Gapir Android app (Capacitor shell around the deployed site) and
# uploads a debug-signed APK as the "gapir-apk" artifact of the run.
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor.config.ts"
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
      - "public/gapir-logo.png"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Production address of the site; set the repository variable to override.
      GAPIR_APP_URL: ${{ vars.GAPIR_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # Only the Capacitor CLI is needed here: skip native builds of server deps.
      - run: npm ci --ignore-scripts

      - name: Create the Android project
        run: |
          npx cap add android
          mkdir -p assets
          cp public/gapir-logo.png assets/icon-only.png
          cp public/gapir-logo.png assets/icon-foreground.png
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor "#ffffff" --iconBackgroundColorDark "#0b1020" --splashBackgroundColor "#f8fbff" --splashBackgroundColorDark "#0b1020"
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Gapir.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: gapir-apk
          path: Gapir.apk
          retention-days: 30
